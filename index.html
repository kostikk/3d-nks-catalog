<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D NKS — каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="products.js?v=4"></script>
<style>
:root{--bg:#080b10;--card:#121821;--card2:#0f151d;--line:#243141;--text:#fff;--muted:#8f9bab;--blue:#19bfff;--blue2:#2878ff;--danger:#ff5f67}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{cursor:pointer}
main{max-width:760px;margin:auto;padding:16px 14px calc(104px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}.brand{font-size:25px;font-weight:900}.brand span{color:var(--blue)}
.cart-btn{position:relative;border:1px solid var(--line);background:#121821;color:#fff;border-radius:14px;padding:10px 13px;font-weight:800}.cart-count{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--blue);color:#061019;font-size:12px;display:flex;align-items:center;justify-content:center}
.hero{padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#111a27,#0d1219);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0 0 16px;color:var(--muted);line-height:1.45}.hero button,.primary{border:0;background:linear-gradient(90deg,var(--blue2),var(--blue));color:#fff;border-radius:13px;padding:13px 17px;font-weight:900}
.search{margin:15px 0;padding:13px 14px;border:1px solid var(--line);background:#111720;border-radius:14px;display:flex;align-items:center;gap:8px}.search input{width:100%;border:0;outline:0;background:none;color:#fff}.search input::placeholder{color:#788494}
h2{margin:21px 0 12px;font-size:22px}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cat{border:1px solid var(--line);background:#121821;color:#fff;border-radius:15px;padding:13px;font-weight:800}.cat.active{border-color:var(--blue);box-shadow:0 0 0 1px rgba(25,191,255,.2) inset}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.product{border:1px solid var(--line);background:var(--card);border-radius:17px;overflow:hidden}.product img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.info{padding:11px}.info b{display:block;font-size:15px;line-height:1.25}.info small{display:block;color:var(--muted);margin-top:6px}.price{display:block;color:var(--blue);font-weight:900;font-size:18px;margin:7px 0}.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ghost,.primary{width:100%;padding:11px 10px;border-radius:11px;border:1px solid var(--line);font-weight:900}.ghost{background:#1a2430;color:#fff}.primary{border:0}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px max(14px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));background:rgba(9,13,19,.96);border-top:1px solid var(--line);z-index:20}.bottom-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:10px}.bottom button{min-height:48px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:50;padding:16px;overflow:auto}.modal-card{max-width:560px;margin:5vh auto 0;background:#111720;border:1px solid #2a3747;border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.close{float:right;border:0;background:#202a36;color:#fff;border-radius:10px;width:38px;height:38px;font-size:20px}.detail-img{width:100%;border-radius:15px;display:block;max-height:62vh;object-fit:contain;background:#0b1017}.detail h3{font-size:24px;margin:14px 0 6px}.detail-meta{color:var(--muted);margin-bottom:9px}.detail-price{font-size:23px;font-weight:900;color:var(--blue);margin-bottom:14px}
.field{margin:10px 0}.field label{display:block;color:#9eabba;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #293545;background:#0b1017;color:#fff;border-radius:12px;padding:12px;outline:none}.field textarea{min-height:80px;resize:vertical}.actions{display:flex;gap:10px;margin-top:15px}.actions button{flex:1}.cancel{background:#232c38!important}
.cart-list{display:grid;gap:9px;margin:12px 0}.cart-item{border:1px solid var(--line);border-radius:14px;padding:10px;background:#0d131b;display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center}.cart-item img{width:58px;height:58px;border-radius:10px;object-fit:cover}.cart-item b{display:block}.cart-item small{color:var(--muted)}.qty{display:flex;align-items:center;gap:7px;margin-top:7px}.qty button{width:28px;height:28px;border:0;border-radius:8px;background:#202a36;color:#fff}.remove{border:0;background:none;color:#ff7b82;font-size:12px}.total{padding:13px;border-radius:14px;background:#0d131b;border:1px solid var(--line);display:flex;justify-content:space-between;font-weight:900;margin:12px 0}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.badge{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:999px;background:#1b2531;color:#aeb8c6;font-size:11px}.fav-on{color:#ff7b82;border-color:#ff7b82}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#151f2b;border:1px solid #2a394b;color:#fff;padding:12px 15px;border-radius:12px;z-index:100;display:none;max-width:88%;text-align:center}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:430px){.cats{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style>
</head>
<body>
<main>
  <header class="header">
    <div><div class="brand">3D <span>NKS</span></div><small style="color:var(--muted)">3D PRINTING STUDIO</small></div>
    <div style="display:flex;gap:8px"><button class="cart-btn" onclick="openFavorites()">♡ <span class="cart-count" id="favCount">0</span></button><button class="cart-btn" onclick="openCart()">🛒 Корзина <span class="cart-count" id="cartCount">0</span></button></div>
  </header>

  <section class="hero">
    <h1>3D-модели и печать</h1>
    <p>Фигурки, брелоки, аксессуары и изделия на заказ.</p>
    <button onclick="document.querySelector('#catalog').scrollIntoView({behavior:'smooth'})">🛍 Открыть каталог</button>
  </section>

  <div class="search">⌕ <input id="q" placeholder="Поиск товара..." oninput="filterProducts()"></div>

  <h2>Категории</h2>
  <div class="cats">
    <button class="cat active" data-cat="Все" onclick="setCategory('Все',this)">🛍 Все</button>
    <button class="cat" data-cat="Фигурки" onclick="setCategory('Фигурки',this)">🐉 Фигурки</button>
    <button class="cat" data-cat="Брелоки" onclick="setCategory('Брелоки',this)">🔑 Брелоки</button>
    <button class="cat" data-cat="Аксессуары" onclick="setCategory('Аксессуары',this)">🏷️ Аксессуары</button>
    <button class="cat" data-cat="Под заказ" onclick="setCategory('Под заказ',this)">🛠️ Под заказ</button>
  </div>

  <h2 id="catalog">Каталог</h2>
  <div class="grid" id="products"></div>
</main>

<section style="max-width:760px;margin:0 auto;padding:0 14px 90px;color:var(--muted);font-size:12px;text-align:center">Каталог 3D NKS · товары и цены редактируются в файле <b style="color:#fff">products.js</b></section>

<div class="bottom"><div class="bottom-inner"><button class="ghost" onclick="openCart()">🛒 Корзина <span id="bottomSummary">пуста</span></button><button class="primary" onclick="openCart()">Оформить</button></div></div>

<div class="modal" id="detailModal"><div class="modal-card detail"><button class="close" onclick="closeModal('detailModal')">×</button><img id="detailImg" class="detail-img"><h3 id="detailName"></h3><div id="detailMeta" class="detail-meta"></div><div id="detailDescription" style="color:var(--muted);line-height:1.5;margin-bottom:10px"></div><div id="detailPrice" class="detail-price"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px"><button class="ghost" id="detailFav">♡ В избранное</button><button class="ghost" id="detailShare">↗ Поделиться</button></div><button class="primary" id="detailAdd">🛒 Добавить в корзину</button></div></div>

<div class="modal" id="favoritesModal"><div class="modal-card"><button class="close" onclick="closeModal('favoritesModal')">×</button><h2 style="margin-top:0">Избранное</h2><div id="favoritesList" class="cart-list"></div></div></div>

<div class="modal" id="cartModal"><div class="modal-card"><button class="close" onclick="closeModal('cartModal')">×</button><h2 style="margin-top:0">Корзина</h2><div id="cartList" class="cart-list"></div><div id="cartTotal" class="total"><span>Итого</span><span>0 сум</span></div><button class="primary" id="checkoutBtn" onclick="openCheckout()">Перейти к оформлению</button></div></div>

<div class="modal" id="checkoutModal"><div class="modal-card"><button class="close" onclick="closeModal('checkoutModal')">×</button><h2 style="margin-top:0">Оформление заказа</h2><div id="checkoutSummary" style="color:var(--muted);margin-bottom:12px"></div><div class="field"><label>Ваше имя</label><input id="customerName" placeholder="Введите имя"></div><div class="field"><label>Телефон / Telegram</label><input id="customerContact" placeholder="+998 ... или @username"></div><div class="field"><label>Комментарий</label><textarea id="comment" placeholder="Цвет, размер, пожелания..."></textarea></div><div class="actions"><button class="ghost cancel" onclick="closeModal('checkoutModal')">Отмена</button><button id="sendOrderBtn" class="primary" type="button" onclick="submitOrder(event)">📩 Отправить</button></div></div></div>

<div class="toast" id="toast"></div>
<iframe name="orderSubmitFrame" id="orderSubmitFrame" style="display:none"></iframe>

<script>

let category='Все';
let currentDetail=null;
let cart=JSON.parse(localStorage.getItem('3dNksCart')||'[]');
let favorites=JSON.parse(localStorage.getItem('3dNksFav')||'[]');
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbwlGEcB1zbKwB0vmSCfHZ6-cWg9iCvw-idrqbz6-WQ0KJXYHA5fTHhPJcqEKjoHbRtR/exec';

function money(n){return Number(n).toLocaleString('ru-RU')+' сум'}
function saveCart(){localStorage.setItem('3dNksCart',JSON.stringify(cart));updateCartUI()}
function saveFav(){localStorage.setItem('3dNksFav',JSON.stringify(favorites));updateFavUI()}
function cartCount(){return cart.reduce((s,x)=>s+x.qty,0)}
function cartTotal(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}
function isFav(id){return favorites.includes(id)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.style.display='none',2200)}

function renderProducts(){
 const q=document.getElementById('q').value.toLowerCase().trim();
 const box=document.getElementById('products');
 box.innerHTML='';
 PRODUCTS.filter(p=>(p.active!==false)&&(category==='Все'||p.cat===category)&&(!q||(p.name+' '+p.cat+' '+p.meta+' '+(p.description||'')).toLowerCase().includes(q))).forEach(p=>{
   const el=document.createElement('article');el.className='product';
   const badge=p.badge?`<span class="badge">${p.badge}</span>`:'';
   el.innerHTML=`<img src="${p.img}" alt="${p.name}" onclick="openDetail('${p.id}')"><div class="info"><b>${p.name}</b><small>${p.meta}</small>${badge}<span class="price">${money(p.price)}</span><div class="product-actions"><button class="ghost" onclick="openDetail('${p.id}')">Подробнее</button><button class="primary" onclick="addToCart('${p.id}')">🛒 В корзину</button></div></div>`;
   box.appendChild(el);
 });
 if(!box.children.length) box.innerHTML='<div class="empty" style="grid-column:1/-1">Ничего не найдено</div>';
}

function setCategory(c,el){category=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderProducts()}
function filterProducts(){renderProducts()}

function openDetail(id){
 currentDetail=PRODUCTS.find(p=>p.id===id);if(!currentDetail)return;
 document.getElementById('detailImg').src=currentDetail.img;
 document.getElementById('detailName').textContent=currentDetail.name;
 document.getElementById('detailMeta').textContent=currentDetail.cat+' · '+currentDetail.meta;
 document.getElementById('detailDescription').textContent=currentDetail.description||'Изделие можно заказать в указанных размерах. Цвет и детали уточняются при заказе.';
 document.getElementById('detailPrice').textContent=money(currentDetail.price);
 const favBtn=document.getElementById('detailFav');
 favBtn.textContent=isFav(currentDetail.id)?'♥ В избранном':'♡ В избранное';
 favBtn.classList.toggle('fav-on',isFav(currentDetail.id));
 favBtn.onclick=()=>toggleFav(currentDetail.id);
 document.getElementById('detailShare').onclick=()=>shareProduct(currentDetail.id);
 document.getElementById('detailAdd').onclick=()=>{addToCart(currentDetail.id);closeModal('detailModal')};
 document.getElementById('detailModal').style.display='block';
}

function toggleFav(id){
 if(isFav(id)) favorites=favorites.filter(x=>x!==id); else favorites.push(id);
 saveFav();
 if(currentDetail&&currentDetail.id===id){
   const b=document.getElementById('detailFav');
   b.textContent=isFav(id)?'♥ В избранном':'♡ В избранное';
   b.classList.toggle('fav-on',isFav(id));
 }
 toast(isFav(id)?'♥ Добавлено в избранное':'Убрано из избранного');
}

function openFavorites(){
 const list=document.getElementById('favoritesList');
 const items=PRODUCTS.filter(p=>favorites.includes(p.id));
 if(!items.length){list.innerHTML='<div class="empty">Избранных товаров пока нет</div>';}
 else{
   list.innerHTML=items.map(x=>`<div class="cart-item"><img src="${x.img}"><div><b>${x.name}</b><small>${money(x.price)}</small><div class="qty"><button onclick="openDetail('${x.id}')">Подробнее</button><button class="remove" onclick="toggleFav('${x.id}');openFavorites()">Удалить</button></div></div><strong>${money(x.price)}</strong></div>`).join('');
 }
 document.getElementById('favoritesModal').style.display='block';
}

async function shareProduct(id){
 const p=PRODUCTS.find(x=>x.id===id);if(!p)return;
 const url=location.href.split('#')[0]+'#product='+encodeURIComponent(id);
 const text=`${p.name} — ${money(p.price)}`;
 try{
   if(navigator.share) await navigator.share({title:p.name,text,url});
   else {await navigator.clipboard.writeText(url);toast('🔗 Ссылка скопирована');}
 }catch(e){}
}

function addToCart(id){
 const p=PRODUCTS.find(x=>x.id===id);if(!p)return;
 const row=cart.find(x=>x.id===id);
 if(row)row.qty++;else cart.push({id:p.id,name:p.name,price:p.price,img:p.img,qty:1});
 saveCart();toast('✅ Добавлено в корзину');
}
function changeQty(id,d){const row=cart.find(x=>x.id===id);if(!row)return;row.qty+=d;if(row.qty<=0)cart=cart.filter(x=>x.id!==id);saveCart();renderCart()}
function removeItem(id){cart=cart.filter(x=>x.id!==id);saveCart();renderCart()}
function updateCartUI(){document.getElementById('cartCount').textContent=cartCount();document.getElementById('bottomSummary').textContent=cart.length?cartCount()+' шт. · '+money(cartTotal()):'пуста'}
function updateFavUI(){document.getElementById('favCount').textContent=favorites.length}

function renderCart(){
 const list=document.getElementById('cartList'),total=document.getElementById('cartTotal'),btn=document.getElementById('checkoutBtn');
 if(!cart.length){
   list.innerHTML='<div class="empty">Корзина пока пуста</div>';
   total.innerHTML='<span>Итого</span><span>0 сум</span>';
   btn.disabled=true;btn.style.opacity='.5';return;
 }
 btn.disabled=false;btn.style.opacity='1';
 list.innerHTML=cart.map(x=>`<div class="cart-item"><img src="${x.img}"><div><b>${x.name}</b><small>${money(x.price)}</small><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><strong>${x.qty}</strong><button onclick="changeQty('${x.id}',1)">+</button><button class="remove" onclick="removeItem('${x.id}')">Удалить</button></div></div><strong>${money(x.price*x.qty)}</strong></div>`).join('');
 total.innerHTML='<span>Итого</span><span>'+money(cartTotal())+'</span>';
}

function openCart(){renderCart();document.getElementById('cartModal').style.display='block'}
function openCheckout(){if(!cart.length)return;closeModal('cartModal');document.getElementById('checkoutSummary').textContent='Товаров: '+cartCount()+' шт. · Итого: '+money(cartTotal());document.getElementById('checkoutModal').style.display='block'}
function closeModal(id){document.getElementById(id).style.display='none'}

function submitOrder(event){
 event?.preventDefault();event?.stopPropagation();
 const customer=document.getElementById('customerName').value.trim();
 const contact=document.getElementById('customerContact').value.trim();
 const comment=document.getElementById('comment').value.trim();
 if(!customer||!contact){
   const m='Заполните имя и телефон / Telegram';
   if(window.Telegram?.WebApp?.showAlert)Telegram.WebApp.showAlert(m);else alert(m);
   return;
 }
 const items=cart.map(x=>x.name+' × '+x.qty).join('; ');
 const total=cartTotal();
 const orderPayload=JSON.stringify({name:items,price:total,qty:cartCount(),total:total,customer:customer,contact:contact,comment:comment||'—'});
 const form=document.createElement('form');form.method='POST';form.action=WEBAPP_URL;form.target='orderSubmitFrame';form.style.display='none';
 const input=document.createElement('input');input.type='hidden';input.name='order';input.value=orderPayload;form.appendChild(input);document.body.appendChild(form);
 const btn=document.getElementById('sendOrderBtn');btn.disabled=true;btn.textContent='⏳ Отправляем...';
 let done=false;
 const frame=document.getElementById('orderSubmitFrame');
 frame.onload=()=>{
   if(done)return;done=true;
   setTimeout(()=>{
     btn.disabled=false;btn.textContent='📩 Отправить';form.remove();closeModal('checkoutModal');
     cart=[];saveCart();
     document.getElementById('customerName').value='';document.getElementById('customerContact').value='';document.getElementById('comment').value='';
     const m='✅ Заказ отправлен в 3D NKS';
     if(window.Telegram?.WebApp?.showAlert)Telegram.WebApp.showAlert(m);else alert(m);
   },250);
 };
 form.submit();
 setTimeout(()=>{
   if(done)return;done=true;btn.disabled=false;btn.textContent='📩 Отправить';form.remove();
   const m='⚠️ Не удалось подтвердить отправку. Проверьте подключение.';
   if(window.Telegram?.WebApp?.showAlert)Telegram.WebApp.showAlert(m);else alert(m);
 },10000);
}

function handleHash(){
 const match=location.hash.match(/product=([^&]+)/);
 if(match){
   try{openDetail(decodeURIComponent(match[1]))}catch(e){}
 }
}

window.addEventListener('click',e=>{['detailModal','cartModal','checkoutModal','favoritesModal'].forEach(id=>{const m=document.getElementById(id);if(e.target===m)closeModal(id)})});
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
renderProducts();updateCartUI();updateFavUI();handleHash();

</script>
</body>
</html>
